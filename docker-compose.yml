services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: rfs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ripfarsight
      POSTGRES_USER: ${POSTGRES_USER:-rfsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfspassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rfsuser} -d ripfarsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rfs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: rfs-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rfsuser}:${POSTGRES_PASSWORD:-rfspassword}@db:5432/ripfarsight
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PAYSLIP_DIR: /app/storage/payslips
      UPLOADS_DIR: /app/storage/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hexalog.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
    volumes:
      - rfs_storage:/app/storage
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Database migrations + seed (runs once then exits)
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: rfs-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rfsuser}:${POSTGRES_PASSWORD:-rfspassword}@db:5432/ripfarsight
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hexalog.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
    command: sh -c "npx prisma migrate deploy && npx ts-node prisma/seed.ts"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Frontend (React SPA served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: rfs-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  rfs_storage:
